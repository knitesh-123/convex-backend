services:
  backend:
    image: ${CONVEX_BACKEND_IMAGE:-ghcr.io/get-convex/convex-backend:latest}
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:${PORT:-3210}:3210"
      - "127.0.0.1:${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - data:/convex/data
    environment:
      - ACTIONS_USER_TIMEOUT_SECS
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=${APPLICATION_MAX_CONCURRENT_MUTATIONS:-16}
      - APPLICATION_MAX_CONCURRENT_NODE_ACTIONS=${APPLICATION_MAX_CONCURRENT_NODE_ACTIONS:-16}
      - APPLICATION_MAX_CONCURRENT_QUERIES=${APPLICATION_MAX_CONCURRENT_QUERIES:-16}
      - APPLICATION_MAX_CONCURRENT_V8_ACTIONS=${APPLICATION_MAX_CONCURRENT_V8_ACTIONS:-16}
      - AWS_ACCESS_KEY_ID
      - AWS_REGION
      - AWS_S3_DISABLE_CHECKSUMS
      - AWS_S3_DISABLE_SSE
      - AWS_S3_FORCE_PATH_STYLE
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - CONVEX_CLOUD_ORIGIN
      - CONVEX_RELEASE_VERSION_DEV
      - CONVEX_SITE_ORIGIN
      - DATABASE_URL
      - DISABLE_BEACON
      - DISABLE_METRICS_ENDPOINT=${DISABLE_METRICS_ENDPOINT:-false}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - DO_NOT_REQUIRE_SSL
      - HTTP_SERVER_TIMEOUT_SECONDS
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - MYSQL_URL
      - POSTGRES_URL
      - REDACT_LOGS_TO_CLIENT=${REDACT_LOGS_TO_CLIENT:-true}
      - RUST_BACKTRACE
      - RUST_LOG=${RUST_LOG:-info}
      - S3_ENDPOINT_URL
      - S3_STORAGE_EXPORTS_BUCKET
      - S3_STORAGE_FILES_BUCKET
      - S3_STORAGE_MODULES_BUCKET
      - S3_STORAGE_SEARCH_BUCKET
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  metricsadapter:
    image: ${METRICS_ADAPTER_IMAGE:-python:3.12-alpine}
    command:
      - python
      - /app/metrics_adapter.py
    environment:
      UPSTREAM_METRICS_URL: http://backend:3210/metrics
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "9464"
    ports:
      - "${METRICS_ADAPTER_BIND_IP:-0.0.0.0}:${METRICS_ADAPTER_PORT:-9464}:9464"
    volumes:
      - ./observability/metrics_adapter/metrics_adapter.py:/app/metrics_adapter.py:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
